services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      FRONTEND_DIST: /app/frontend_dist
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/atoms.db
      RATE_LIMIT_DAILY: "50"
    volumes:
      - atoms-data:/app/data
    restart: unless-stopped

volumes:
  atoms-data:
